name: NEU seat watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [once, test-alert, list-terms, watch]
        default: once

permissions:
  contents: write

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Check seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python seat_watcher.py --mode "${{ github.event.inputs.mode || 'watch' }}"

      - name: Save state
        if: always() && (github.event.inputs.mode || 'watch') == 'watch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update seat state"
              git pull --rebase
              git push
            fi
          fi
