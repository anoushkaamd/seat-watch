name: Daily heartbeat

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC, about 9am Eastern
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: seat-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Send heartbeat
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python seat_watcher.py --mode heartbeat

      # A daily commit counts as repo activity, so GitHub does not pause the
      # scheduled workflows after 60 days of inactivity.
      - name: Save heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily heartbeat"
            git pull --rebase
            git push
          fi
